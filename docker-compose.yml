services:
  orion:
    build: .
    container_name: orion
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 384m
    cpus: 1.0
    expose:
      - "8000"
    networks:
      - reconix-cloud_default
    volumes:
      - orion_data:/app/data

networks:
  reconix-cloud_default:
    external: true

volumes:
  orion_data:
